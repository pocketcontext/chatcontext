name: Chat integration
on:
  # image.yml calls this workflow before it publishes an image.
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: chatcontext
          persist-credentials: false
      - name: Install packaged CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/client-venv"
          "$RUNNER_TEMP/client-venv/bin/python" -m pip install uv==0.12.21 ./chatcontext
          echo "$RUNNER_TEMP/client-venv/bin" >> "$GITHUB_PATH"
      - name: Test standalone launcher
        run: python3 chatcontext/tests/launcher.py
      - name: Test deployment orchestration
        run: python3 chatcontext/tests/deploy_workflow.py
      - name: Python runtime safety
        run: python3 chatcontext/tests/entrypoint.py
      - name: Test complete evidence backups
        run: python3 chatcontext/tests/backup.py
      - name: Primary object storage configuration
        run: python3 chatcontext/tests/object_storage_settings.py
      - name: Read server revision
        id: server
        shell: bash
        run: |
          revision=$(cat chatcontext/POCKETCONTEXT_VERSION)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pocketcontext/pocketcontext
          ref: ${{ steps.server.outputs.revision }}
          path: pocketcontext
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pocketcontext/go.mod
          cache-dependency-path: pocketcontext/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build and test reader
        working-directory: chatcontext/ui
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Build server
        working-directory: pocketcontext
        # The flags of pocketcontext's Makefile.
        run: CGO_ENABLED=1 go build -tags sqlite_math_functions -o bin/pocketcontext ./cmd/pocketcontext
      - name: Test messaging
        run: python3 chatcontext/tests/integration.py --binary pocketcontext/bin/pocketcontext
      - name: Test public directory upgrade
        run: python3 chatcontext/tests/directory_migration.py --binary pocketcontext/bin/pocketcontext
      - name: Test authorization boundaries
        run: python3 chatcontext/tests/security.py --binary pocketcontext/bin/pocketcontext
      - name: Test realtime authorization and revocation
        run: python3 chatcontext/tests/realtime.py --binary pocketcontext/bin/pocketcontext
      - name: Test authentication and deployment settings
        run: python3 chatcontext/tests/auth.py --binary pocketcontext/bin/pocketcontext
      - name: Test Google OAuth claims and Workspace signup
        run: python3 chatcontext/tests/oauth_integration.py --binary pocketcontext/bin/pocketcontext
      - name: Test complete live evidence recovery
        run: python3 chatcontext/tests/backup_integration.py --binary pocketcontext/bin/pocketcontext
      - name: Test first-start deployment settings
        run: python3 chatcontext/tests/deploy.py --binary pocketcontext/bin/pocketcontext
      - name: Test installable skill
        run: python3 chatcontext/tests/skill.py --binary pocketcontext/bin/pocketcontext
      - name: Test instrumented uploads and commands
        run: python3 chatcontext/tests/skill.py --binary pocketcontext/bin/pocketcontext --trace
      - name: Test portable client utilities
        run: python3 chatcontext/tests/client.py
      - name: Test OAuth client
        run: python3 chatcontext/tests/oauth.py
      - name: Test opt-in tracing and snapshot ownership
        run: python3 chatcontext/tests/tracing.py --binary pocketcontext/bin/pocketcontext
      - name: Test reader privacy and navigation in Chromium
        run: python3 chatcontext/tests/ui_browser.py --binary pocketcontext/bin/pocketcontext
      - name: Durable runtime maintenance
        run: python3 chatcontext/tests/maintenance.py --binary pocketcontext/bin/pocketcontext
