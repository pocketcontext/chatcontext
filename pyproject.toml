[project]
name = "chatcontext-client"
version = "0.1.0"
description = "chatcontext portable client"
requires-python = ">=3.11"
dependencies = ["observecontext-client @ git+https://github.com/pocketcontext/observecontext.git@d10e84bb30ce607c03c62c03a4fdfd596d32ab27"]

[project.scripts]
chatcontext = "chatcontext_client.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chatcontext_client"]
